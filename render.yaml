services:
  - type: web
    name: pinnacle-u-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx server/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Pinnacle University <onboarding@resend.dev>
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
